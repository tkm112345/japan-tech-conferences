name: カンファレンスを追加
description: JSON を書かなくても大丈夫。フォームに入力するだけでメンテナがデータ化します。
title: "[追加] カンファレンス名 20XX"
labels: ["conference", "data"]
body:
  - type: input
    id: name
    attributes:
      label: カンファレンス名（年を含む）
      placeholder: 例) PyCon JP 2026
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 公式サイト URL（https）
      placeholder: https://example.com/
    validations:
      required: true
  - type: input
    id: startDate
    attributes:
      label: 開催開始日 (YYYY-MM-DD)
      placeholder: 2026-08-21
    validations:
      required: true
  - type: input
    id: endDate
    attributes:
      label: 開催終了日 (YYYY-MM-DD、単日なら開始日と同じ)
      placeholder: 2026-08-23
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: 開催形式
      options:
        - onsite
        - online
        - hybrid
    validations:
      required: true
  - type: input
    id: place
    attributes:
      label: 開催地（都道府県・都市）※オンライン専用は空欄可
      placeholder: 広島県 広島市
  - type: input
    id: topics
    attributes:
      label: トピック（カンマ区切り）
      description: "使える値は README のトピック一覧を参照"
      placeholder: python, web
    validations:
      required: true
  - type: input
    id: cfp
    attributes:
      label: CFP（登壇募集）URL ※あれば
      placeholder: https://example.com/cfp
  - type: checkboxes
    id: checks
    attributes:
      label: 確認
      options:
        - label: 公式サイトで日程を確認しました（推測ではありません）
          required: true
